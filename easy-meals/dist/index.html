:root{--paper:#f8f7f2;--ink:#293a30;--muted:#7f8579;--green:#476347;--line:#e1e4d8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 system-ui,'Microsoft Yahei',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #c68c54;outline-offset:3px}aside{position:fixed;width:228px;inset:0 auto 0 0;border-right:1px solid var(--line);padding:36px 25px;background:#f1f2e9;display:flex;flex-direction:column}.brand{font-size:24px;font-weight:750;letter-spacing:2px}.brand span{color:#8b9c65}.sub{font-size:11px;color:var(--muted);letter-spacing:2px;margin:4px 0 42px}nav button{display:block;text-align:left;width:100%;background:none;border:0;color:#727b6c;padding:14px 18px;margin:6px 0;border-radius:9px}nav button.active{background:#e1e8d7;color:#35523a;font-weight:650}.aside-note{margin-top:auto;font-size:12px;color:#79816f;border-top:1px solid var(--line);padding-top:22px}main{max-width:1350px;margin-left:228px;padding:35px 48px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:22px;font-size:12px;color:var(--muted)}.pill{background:#e8ecdf;border-radius:20px;padding:5px 12px;color:#60724f}.intro{margin:30px 0 25px;display:flex;justify-content:space-between;align-items:end}h1{font:500 33px/1.4 Georgia,'Microsoft Yahei',serif;margin:7px 0}h2{font-size:19px;margin:0}h3{margin:0 0 8px;font-size:18px}p{margin:8px 0}.muted{color:var(--muted);font-size:13px}.eyebrow{font-size:11px;letter-spacing:2px;color:#8c946e}.btn{border:0;background:var(--green);color:white;border-radius:7px;padding:10px 18px}.ghost{background:transparent;color:var(--green);border:1px solid #cbd2bf}.hero{display:grid;grid-template-columns:1.2fr .8fr;background:#e9eddf;border-radius:15px;overflow:hidden;margin-bottom:30px;min-height:245px}.hero-copy{padding:30px}.hero h2{font-size:27px;font-weight:500;margin:8px 0}.hero p{max-width:390px;color:#6e7962;font-size:13px}.hero-art{position:relative;background:#e0e5d3;display:grid;place-items:center;overflow:hidden}.plate{width:190px;height:190px;border:14px solid #faf9ef;border-radius:50%;background:#f2e8ce;box-shadow:0 12px 20px #68735024;display:grid;place-items:center;font-size:95px;transform:rotate(-12deg)}.art-label{position:absolute;bottom:17px;right:18px;font-size:11px;color:#7c876a}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:26px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card,.panel{background:#fffefa;border:1px solid var(--line);border-radius:12px;overflow:hidden}.food{height:133px;display:flex;align-items:center;justify-content:center;font-size:76px;background:#f0e3cf}.food.green{background:#e4e9d8}.card-body{padding:18px}.tag{font-size:10px;letter-spacing:1px;color:#82916a;margin-bottom:8px}.meta{font-size:12px;color:#8b8d80;margin:8px 0 17px}.card button{width:100%}.panel{padding:20px;margin-bottom:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #eef0e6}.row:last-child{border:0}.stock-icon{font-size:26px}.stock-name{flex:1;font-size:13px}.counter{display:flex;align-items:center;gap:10px}.counter button{border:1px solid var(--line);background:#fafbf6;width:25px;height:25px;border-radius:5px;padding:0;line-height:20px}.quote{background:#eee9dc;border:0;color:#79735d;font-size:13px}.bottom{margin-top:25px;border-top:1px solid var(--line);padding:20px 0;color:var(--muted);font-size:12px}.empty{padding:50px;text-align:center}.recipe-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.badge{display:inline-block;background:#edf0e5;color:#778365;font-size:11px;padding:3px 8px;border-radius:4px}.note{padding:12px;background:#f3f4ec;font-size:12px;color:#737c65;border-radius:7px;margin:15px 0}dialog{border:1px solid var(--line);border-radius:15px;padding:28px;max-width:570px;width:calc(100% - 30px);max-height:90vh;overflow:auto;color:var(--ink);background:#fffefa}dialog::backdrop{background:#26342965;backdrop-filter:blur(3px)}.close{float:right;background:none;border:0;font-size:24px;color:#758069}.field{display:block;margin:15px 0}.field input,.field select,.field textarea{display:block;width:100%;padding:9px;border:1px solid #d6dccd;background:#fafbf6;border-radius:6px;color:var(--ink)}.ingredients{width:100%;border-collapse:collapse;font-size:14px}.ingredients td{padding:8px;border-bottom:1px solid var(--line)}.ingredients td:last-child{text-align:right}ol{padding-left:22px}li{margin:12px 0}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:12px 22px;background:#354d39;color:#fff;border-radius:9px;z-index:5}button:disabled{opacity:.4;cursor:default}@media(min-width:1500px){main{margin-right:auto}}@media(max-width:1100px){main{padding:25px}.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:16px}.recipe-grid{grid-template-columns:1fr 1fr}}@media(max-width:700px){aside{position:static;width:auto;padding:16px 20px;display:block;border-right:0;border-bottom:1px solid var(--line)}.sub,.aside-note{display:none}nav{display:flex;margin-top:10px}nav button{font-size:12px;padding:9px 7px;text-align:center;margin:0}.brand{font-size:21px}main{margin:0;padding:20px}.intro{align-items:start;gap:10px}h1{font-size:27px}.hero{grid-template-columns:1fr}.hero-art{display:none}.hero-copy{padding:24px}.cards,.recipe-grid,.side{grid-template-columns:1fr}.intro .btn{font-size:12px;padding:9px}header{font-size:10px}.food{height:140px}}
.stock-link{border:0;background:transparent;color:var(--green);padding:2px 0;font-size:12px;text-decoration:underline;text-underline-offset:3px}</style></head><body><aside><div class="brand"><span>◒</span> 好好吃饭</div><div class="sub">A LITTLE COOKING, A GOOD LIFE</div><nav id="nav"></nav><div class="aside-note">一周认真做一两次，<br>其余日子，轻松吃。<p>🌱 慢慢来，也会越来越好。</p></div></aside><main><header><span>我的厨房 / <span id="breadcrumb">本周吃什么</span></span><span class="pill">● 你的省心厨房</span></header><div id="app"></div><div class="bottom">不用每天大展身手。把喜欢的几道菜，做成自己的味道。<br>记录保存在此浏览器 · 示例菜谱为试做起点，可按你的口味调整</div></main><dialog id="modal"></dialog><div id="toast" class="toast" hidden role="status"></div><script>
const initial={stock:[{name:'手工面条',icon:'🍜',count:4,grams:150},{name:'猪肉胡萝卜饺子',icon:'🥟',count:2,grams:200}],plan:[0,1],logs:[],favorites:[0,1,2,3]};let state;try{state=JSON.parse(localStorage.getItem('easy-meals-v1'))||structuredClone(initial)}catch{state=structuredClone(initial)}let page='week';
const recipes=[{name:'番茄炒蛋',icon:'🍅',time:15,desc:'熟悉的酸甜，最省心的一顿。',clean:'一口锅 · 好刷',ingredients:[['番茄',400],['去壳鸡蛋',150],['食用油',12],['盐',2],['糖（可选）',3]],steps:['番茄切块，鸡蛋打散。盐先称好，总共 2g。','锅热后倒入 8g 油，放鸡蛋炒至刚凝固，盛出。','加剩余 4g 油，放番茄炒软出汁，加入盐和可选的糖。','倒回鸡蛋，轻轻翻匀即可。'],tip:'先试这个调味起点。记录番茄和去壳鸡蛋的实际重量，下次才好比较。'}, {name:'辣椒炒肉',icon:'🥩',time:20,desc:'想认真吃顿饭，就来这一盘。',clean:'一口锅 · 需切肉',ingredients:[['猪肉',250],['青椒',200],['食用油',10],['生抽',10],['盐',1],['蒜',8]],steps:['猪肉切薄片，青椒切块，蒜切片。','锅中放油，炒熟肉片，放蒜和生抽。','加入青椒炒至熟透，少量加入称好的盐，再尝味调整。'],tip:'生抽品牌会影响咸淡；本版同时含生抽和盐，盐可先少放。'}, {name:'鸡蛋炒饭',icon:'🍚',time:10,desc:'冰箱里的零碎，也能好好吃。',clean:'一口锅 · 少准备',ingredients:[['熟米饭',300],['去壳鸡蛋',100],['胡萝卜',60],['洋葱',50],['食用油',10],['生抽',8]],steps:['胡萝卜和洋葱切小丁，鸡蛋打散。','放油炒鸡蛋，加入蔬菜炒熟。','加入熟米饭炒散，加生抽翻匀，尝味后再决定是否补盐。'],tip:'先不额外放盐，把这次用的生抽品牌记下来。'}, {name:'手工面条',icon:'🍜',time:45,desc:'一次多做一点，留给想偷懒的日子。',clean:'需揉面 · 可冷冻',ingredients:[['普通面粉',500],['水（按面粉吸水性调整）',220],['盐',3]],steps:['盐溶于水，逐渐加入面粉，揉成偏硬的面团。','盖好醒面约 30 分钟，再揉匀、擀薄、切条。','撒少量面粉防粘，按个人食量称重分份，平铺冻硬后密封。','煮面时可直接从冷冻取出，煮至熟透；记录喜欢的厚度和时间。'],tip:'面粉吸水性不同，水量是起点。库存中填写的是未煮面条的每份重量。'}, {name:'胡萝卜炒鸡蛋',icon:'🥕',time:15,desc:'用常买的食材，试一道简单新菜。',clean:'一口锅 · 好刷',ingredients:[['胡萝卜',200],['去壳鸡蛋',150],['食用油',12],['盐',1.5]],steps:['胡萝卜切细丝，鸡蛋打散。','8g 油炒鸡蛋至凝固，盛出。','剩余油炒胡萝卜，可加少量水炒软。','倒回鸡蛋，加盐翻匀，尝味。'],tip:'本周试做候选。喜欢的话，就加入固定菜谱。'}];

recipes.push({name:'包菜鸡蛋拌面',icon:'🥬',time:15,servings:'1 人份',desc:'用家里的包菜，省下出门买菜的工夫。',clean:'炒锅＋煮面锅 · 好刷',ingredients:[['手工面（未煮，按食量调整）',150],['包菜',150],['去壳鸡蛋（约 1 个）',50],['食用油',6],['生抽',5],['水（可加至 50g）',30]],steps:['包菜洗净沥水，切细丝；鸡蛋打散。同时烧水准备煮面。','炒锅放 6g 油，鸡蛋炒至刚凝固，盛出。','原锅放包菜炒软，加 5g 生抽和 30–50g 水，稍煮。','手工面煮熟后沥水，倒入炒锅，加回鸡蛋拌匀；太干就少量添煮面水。','拌匀后先尝味，再决定是否补调味。'],tip:'先不额外放盐，尤其面团里已经加盐时。面条 150g、去壳鸡蛋 50g 是称重起点，可按食量和实际重量修改；这道更适合留少量汁拌面。'});

if(!state.favorites.includes(5)){state.favorites.push(5);try{localStorage.setItem('easy-meals-v1',JSON.stringify(state))}catch{}}
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('easy-meals-v1',JSON.stringify(state))}catch{toast('浏览器未能保存，请检查存储空间')} }function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').hidden=true,3000)}const tabs=[['week','◷','本周吃什么'],['recipes','▤','我的菜谱'],['stock','❄','冷冻存货'],['progress','↗','做饭记录']];function go(p){page=p;render()}function card(id,slot){let r=recipes[id],last=state.logs.find(l=>l.id===id);return `<article class="card"><div class="food ${id%2?'green':''}">${r.icon}</div><div class="card-body"><div class="tag">${slot===undefined?(state.favorites.includes(id)?'我的固定菜谱':'本周试一道'):slot===0?'本周第一顿 · 熟悉的味道':'本周第二顿 · 随心安排'}</div><h3>${r.name}</h3><p class="muted">${r.desc}</p><div class="meta">◷ ${r.time} 分钟　·　${r.clean}</div>${last?`<div class="note">上次：${esc(last.salt)} · ${esc(last.willing)}</div>`:''}<button class="btn ghost" onclick="openRecipe(${id})">查看菜谱 & 开始做 →</button>${slot!==undefined?`<button style="border:0;background:none;color:#879175;font-size:12px;margin-top:10px" onclick="choose(${slot})">换一道菜</button>`:''}</div></article>`}function stockRows(){return state.stock.map((s,i)=>`<div class="row"><span class="stock-icon">${esc(s.icon)}</span><div class="stock-name">${esc(s.name)}<div class="muted">${s.grams}g / 份</div></div><div class="counter"><button aria-label="取用${esc(s.name)}一份" onclick="useStock(${i})" ${s.count<1?'disabled':''}>−</button><b>${s.count}</b><span class="muted">份</span></div></div>`).join('')}
function render(){$('#nav').innerHTML=tabs.map(([p,i,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${i}　${t}</button>`).join('');$('#breadcrumb').textContent=tabs.find(t=>t[0]===page)[2];let html='';if(page==='week')html=`<div class="intro"><div><div class="eyebrow">YOUR WEEK, SIMPLIFIED</div><h1>这周，也好好吃饭。</h1><p class="muted">认真做两顿，其他时候简单一点。</p></div><button class="btn ghost" onclick="shopping()">＋ 本周采购</button></div><section class="hero"><div class="hero-copy"><div class="eyebrow">LESS EFFORT, MORE COMFORT</div><h2>做喜欢的菜，<br>过不慌不忙的日子。</h2><p>不必每天想新花样。一两道熟悉的味道，<br>加上冰箱里备好的面条，就很不错。</p><button class="btn" onclick="openRecipe(${state.plan[0]})" style="margin-top:12px">今天就做这道 →</button></div><div class="hero-art"><div class="plate">🍅</div><span class="art-label">简单一点，也很好吃。</span></div></section><div class="layout"><section><div class="section-head"><h2>本周的两顿饭</h2><span class="muted">时间由你决定</span></div><div class="cards">${state.plan.map((id,i)=>card(id,i)).join('')}</div><div class="panel" style="margin-top:20px"><div class="eyebrow">A LITTLE ADVENTURE</div><div class="row"><div><h3>这周，试试胡萝卜炒鸡蛋？</h3><span class="muted">都是常买的食材 · 15 分钟 · 一口锅</span></div><button class="btn ghost" onclick="openRecipe(4)">看看做法</button></div></div></section><section class="side"><div class="panel"><div class="section-head"><h2>❄ 冷冻里的底气</h2></div>${stockRows()}<button class="btn ghost" style="width:100%;margin-top:15px" onclick="addStock()">＋ 记一笔备餐</button><p class="muted">煮一份面，也算照顾好自己。</p></div><div class="panel quote"><span class="eyebrow">慢慢进步就好</span><p>“好吃、简单、锅好刷，<br>就是值得留下的菜。”</p><span style="font-size:11px">不赶进度，只积累喜欢的味道。</span></div></section></div>`;
if(page==='recipes')html=`<div class="intro"><div><div class="eyebrow">YOUR OWN LITTLE COOKBOOK</div><h1>越做，越合口味。</h1><p class="muted">调味有克数，喜欢的味道有记录。</p></div></div><div class="recipe-grid">${state.favorites.map(id=>card(id)).join('')}</div><div class="panel" style="margin-top:25px"><h3>试做候选</h3>${state.favorites.includes(4)?'<p class="muted">胡萝卜炒鸡蛋已经加入你的固定菜谱。</p>':'<p>胡萝卜炒鸡蛋 · 15 分钟</p><button class="btn ghost" onclick="openRecipe(4)">看看做法</button>'}</div>`;
if(page==='stock')html=`<div class="intro"><div><div class="eyebrow">A LITTLE PREP, AN EASIER DAY</div><h1>冰箱里，有点底气。</h1><p class="muted">只记按份取用的存货，不用管理每根胡萝卜。</p></div><button class="btn" onclick="addStock()">＋ 记一笔备餐</button></div><div class="panel">${stockRows()}<p class="note">初始数量为示例，可用减号调整或新增你的实际备餐。取用时减一份，吃完再补。</p></div>`;
if(page==='progress')html=`<div class="intro"><div><div class="eyebrow">SMALL STEPS, BETTER MEALS</div><h1>喜欢的味道，慢慢留下。</h1><p class="muted">已经留下 ${state.logs.length} 次反馈。不必打卡，每次做饭都算数。</p></div></div>${state.logs.length?state.logs.map(l=>`<div class="panel"><div class="section-head"><h3>${recipes[l.id].icon} ${recipes[l.id].name}</h3><span class="muted">${esc(l.date)}</span></div><span class="badge">${esc(l.salt)}</span> <span class="badge">${esc(l.willing)}</span><p>${esc(l.note||'这次没有额外笔记。')}</p><div class="muted">本次配方：${esc(l.formula||'未记录')}</div><button class="btn ghost" style="margin-top:12px" onclick="openRecipe(${l.id})">下次继续做 →</button></div>`).join(''):'<div class="panel empty"><div style="font-size:48px">🌱</div><h3>从第一顿番茄炒蛋开始</h3><p class="muted">做完记一下咸淡，下次打开菜谱就能看见。</p><button class="btn" onclick="openRecipe(0)">去看看菜谱</button></div>'}`;$('#app').innerHTML=html}
function show(html){$('#modal').innerHTML='<button class="close" aria-label="关闭" onclick="closeModal()">×</button>'+html;if(!$('#modal').open)$('#modal').showModal()}function closeModal(){$('#modal').close()}
function openRecipe(id){let r=recipes[id],last=state.logs.find(l=>l.id===id);show(`<div class="eyebrow">MY RECIPE · 试做起点</div><h1>${r.icon} ${r.name}</h1><p class="muted">${r.time} 分钟 · ${r.clean} · 默认约 ${r.servings||(id===3?'5 份面条':'2 人份')}</p>${last?`<div class="note">上次反馈：${esc(last.salt)}。${last.salt==='偏咸'?'这次可少放一点盐或酱油，其他条件尽量保持一致。':last.salt==='偏淡'?'这次可小幅增加调味，边尝边调整。':'可以先沿用上次的配方。'}<br>${esc(last.note)}</div>`:''}<label class="field">用量倍数（自动换算克数）<select id="scale" onchange="scaleIngredients(${id})"><option value="0.5">半份用量</option><option value="1" selected>原配方用量</option><option value="1.5">1.5 倍用量</option><option value="2">2 倍用量</option></select></label><p class="muted">下面的克数可修改。点“保存为我的配方”留给下次；“做完了，记一下”只记录本次用量。</p><table class="ingredients" id="ingredients"></table><h3 style="margin-top:22px">一步一步来</h3><ol>${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol><div class="note">${r.tip} 倍数仅换算用量，火候和收汁仍需观察；盐可先少加。</div><button class="btn" onclick="feedback(${id})">做完了，记一下 →</button>${!state.favorites.includes(id)?` <button class="btn ghost" onclick="favorite(${id})">加入固定菜谱</button>`:''}`);scaleIngredients(id)}
function scaleIngredients(id){let n=Number($('#scale').value);$('#ingredients').innerHTML=recipes[id].ingredients.map(([name,g],i)=>`<tr><td>${name}</td><td><input aria-label="${name}克数" data-ingredient="${i}" type="number" min="0" step="0.1" value="${+(g*n).toFixed(1)}" style="width:72px;padding:4px;border:1px solid #d6dccd;border-radius:4px"> g</td></tr>`).join('')}
function feedback(id){let amounts=[...document.querySelectorAll('[data-ingredient]')].map((e,i)=>recipes[id].ingredients[i][0]+' '+e.value+'g').join('，');show(`<h2>这一顿，感觉怎么样？</h2><p class="muted">${recipes[id].name} · 十秒记一下，下次更合口味。</p><form id="feedback"><label class="field">咸淡<select name="salt"><option>刚好</option><option>偏淡</option><option>偏咸</option></select></label><label class="field">下次还愿意花这个工夫吗？<select name="willing"><option>愿意再做</option><option>偶尔做做</option><option>暂时不想做</option></select></label><label class="field">想留给下次的一句话<textarea name="note" maxlength="500" placeholder="例如：鸡蛋有点老，下次早点盛出来。"></textarea></label><label class="field">调料品牌 / 实际用量补充<input name="brand" maxlength="200" placeholder="例如：这次用的生抽品牌"></label><button class="btn">保存这次反馈</button></form>`);$('#feedback').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);state.logs.unshift({id,salt:f.get('salt'),willing:f.get('willing'),note:f.get('note'),formula:amounts+(f.get('brand')?'；'+f.get('brand'):''),date:new Date().toLocaleDateString('zh-CN')});save();closeModal();render();toast('记下了，下次做这道菜时提醒你')}}
function favorite(id){if(!state.favorites.includes(id))state.favorites.push(id);save();closeModal();render();toast('已加入你的固定菜谱')}
function choose(slot){show(`<h2>这顿，想吃什么？</h2><p class="muted">只安排两顿，时间随你。</p>${recipes.map((r,id)=>`<div class="row"><span>${r.icon} ${r.name}<br><span class="muted">${r.time} 分钟 · ${r.clean}</span></span><button class="btn ghost" onclick="setPlan(${slot},${id})">选这道</button></div>`).join('')}`)}function setPlan(slot,id){state.plan[slot]=id;save();closeModal();render()}
function useStock(i){if(state.stock[i].count>0){state.stock[i].count--;save();render();toast('取用一份，轻松吃一顿')}}
function addStock(){show(`<h2>给之后的自己，备一点。</h2><form id="stockform"><label class="field">备了什么<input name="name" required maxlength="40" placeholder="例如：手工面条"></label><label class="field">多少份<input name="count" type="number" min="1" max="100" step="1" value="4" required></label><label class="field">每份多少克<input name="grams" type="number" min="1" max="5000" step="1" value="150" required></label><button class="btn">放进冷冻存货</button></form>`);$('#stockform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim();if(!name)return;let same=state.stock.find(s=>s.name===name&&s.grams===Number(f.get('grams')));if(same)same.count+=Number(f.get('count'));else state.stock.push({name,icon:name.includes('饺')?'🥟':'🍜',count:Number(f.get('count')),grams:Number(f.get('grams'))});save();closeModal();render();toast('备餐已记好')}}
function shopping(){let list={};state.plan.forEach(id=>recipes[id].ingredients.forEach(([n,g])=>list[n]=(list[n]||0)+g));show(`<h2>这两顿，需要这些。</h2><p class="muted">按两道菜的原配方合计。先看看家里还有什么。</p>${Object.entries(list).map(([n,g])=>`<label class="row" style="justify-content:start"><input type="checkbox"> <span style="flex:1">${n}</span><span>${g}g</span></label>`).join('')}<div class="note">这是一份临时核对清单，勾选不会保存。香料和调料也列出，家里有就不用买。</div>`)}render();
</script><script src="recipe-notes.js?v=save-stock-3"></script></body></html>
