<!doctype html><html lang="en-NZ"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#223e35"><title>Shop offline</title><style>body{margin:0;background:#f7f6f0;color:#223e35;font:16px/1.8 system-ui;min-height:100vh;display:grid;place-items:center}main{max-width:360px;padding:32px}h1{font-size:26px;font-weight:500}p{color:#79836e}a{display:inline-block;margin-top:18px;padding:10px 22px;background:#223e35;color:white;text-decoration:none;border-radius:6px}</style><main><h1>You are offline.</h1><p>The shop needs a connection to upload media, save products and process orders. Keep photos in your library until they have uploaded.</p><a href="/">Try again</a></main><script>const admin=location.pathname.startsWith('/admin');document.querySelector('a').href=admin?'/admin':'/';try{if(admin&&(localStorage.getItem('mc-admin-language')||'zh')==='zh'){document.documentElement.lang='zh-CN';document.title='小店暂时离线';document.querySelector('h1').textContent='网络稍后再见。';document.querySelector('p').textContent='小店需要联网才能上传、保存商品和处理订单。未上传的照片请保留在相册中。';document.querySelector('a').textContent='重新打开小店';}}catch{}</script></html>
